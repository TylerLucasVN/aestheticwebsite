<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag - Nike.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'toast-in': 'toastIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28)',
                        'toast-out': 'toastOut 0.3s ease-in forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        toastIn: { '0%': { transform: 'translateX(100%)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
                        toastOut: { '0%': { transform: 'translateX(100%)', opacity: '0' } }
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans antialiased bg-white text-gray-900">
    <app-header></app-header>
    <main class="max-w-[1100px] mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">

        <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">

            <div class="flex-1">
                <div class="mb-6">
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Bag</h1>
                </div>

                <div id="emptyState" class="hidden py-10">
                    <p class="text-gray-600 mb-6">There are no items in your bag.</p>
                    <a href="../products/products.html"
                        class="inline-block bg-black text-white font-medium px-6 py-3 rounded-full hover:bg-gray-800 transition-colors">
                        Start Shopping
                    </a>
                </div>

                <div id="cartItemsContainer" class="space-y-6">
                </div>
            </div>

            <div class="lg:w-[350px] flex-shrink-0">
                <div class="sticky top-24">
                    <h2 class="text-2xl font-bold mb-6">Summary</h2>

                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between items-center text-sm md:text-base">
                            <span class="text-gray-600">Subtotal</span>
                            <span class="font-medium" id="summarySubtotal">0₫</span>
                        </div>
                        <div class="flex justify-between items-center text-sm md:text-base">
                            <span class="text-gray-600">Estimated Delivery & Handling</span>
                            <span class="font-medium">Free</span>
                        </div>
                        <div class="border-t border-gray-200 my-4 pt-4 flex justify-between items-center">
                            <span class="text-base font-bold">Total</span>
                            <span class="text-base font-bold" id="summaryTotal">0₫</span>
                        </div>
                    </div>

                    <button id="checkoutBtn"
                        class="w-full bg-black text-white font-medium py-4 rounded-full hover:bg-gray-800 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        Member Checkout
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-20">
            <h3 class="text-xl font-bold mb-6">You Might Also Like</h3>
            <div id="recommendationGrid" class="flex overflow-x-auto gap-4 pb-4 -mx-4 px-4 scrollbar-hide">
            </div>
        </div>
    </main>

    <app-footer></app-footer>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="mobile-menu-backdrop"
        class="fixed inset-0 bg-black/50 z-[150] hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm">
    </div>

    <div id="mobile-menu-drawer"
        class="fixed top-0 right-0 h-full w-[85%] max-w-sm bg-white z-[160] transform translate-x-full transition-transform duration-300 ease-in-out shadow-2xl overflow-y-auto">
        <div class="p-6 flex flex-col h-full">
            <div class="flex justify-between items-center mb-8">
                <a href="../../index.html" class="font-bold text-xl tracking-tighter">NIKE</a>

                <button id="close-mobile-menu" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                    <svg class="h-6 w-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <nav class="flex flex-col space-y-6 text-xl font-bold text-gray-900">
                <a href="../../index.html" class="flex items-center justify-between group hover:text-gray-600">
                    Home
                </a>

                <a href="../products/products.html" class="flex items-center justify-between group hover:text-gray-600">
                    All Products
                    <svg class="h-5 w-5 opacity-0 group-hover:opacity-100 transition-opacity" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
                <a href="../products/products.html?category=men"
                    class="flex items-center justify-between group hover:text-gray-600">
                    Men
                    <svg class="h-5 w-5 opacity-0 group-hover:opacity-100 transition-opacity" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
                <a href="../products/products.html?category=women"
                    class="flex items-center justify-between group hover:text-gray-600">
                    Women
                    <svg class="h-5 w-5 opacity-0 group-hover:opacity-100 transition-opacity" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
                <a href="../products/products.html?category=kids"
                    class="flex items-center justify-between group hover:text-gray-600">
                    Kids
                    <svg class="h-5 w-5 opacity-0 group-hover:opacity-100 transition-opacity" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
                <a href="../products/products.html?category=sale"
                    class="flex items-center justify-between text-red-600 group hover:text-red-700">
                    Sale
                    <svg class="h-5 w-5 opacity-0 group-hover:opacity-100 transition-opacity" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
            </nav>

            <div class="mt-auto pt-10 border-t border-gray-100">
                <div class="flex flex-col space-y-4 text-gray-600 font-medium">
                    <a href="../cart/cart.html" class="hover:text-black flex items-center gap-3">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                        Bag
                    </a>
                    <a href="../favor/favor.html" class="hover:text-black flex items-center gap-3">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                            </path>
                        </svg>
                        Favorites
                    </a>
                    <a href="#" class="hover:text-black flex items-center gap-3">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                        Help
                    </a>
                </div>
                <div class="mt-6 text-sm text-gray-400">
                    <p>Become a Nike Member for the best products, inspiration and stories in sport.</p>
                    <div class="mt-3 flex gap-3">
                        <button class="bg-black text-white px-4 py-2 rounded-full font-bold">Join Us</button>
                        <button class="border border-gray-300 px-4 py-2 rounded-full font-bold">Sign In</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="cart.js"></script>
    <script src="../../assets/js/searchOverlay.js" type="module"></script>
    <script src="../../assets/js/mobile.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>

</html>
