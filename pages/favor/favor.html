<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Nike.com</title>
    <script src="../../assets/js/components.js"></script>
    <link rel="stylesheet" href="../../assets/css/tailwind-build.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'toast-in': 'toastIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28)',
                        'toast-out': 'toastOut 0.3s ease-in forwards',
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        toastIn: { '0%': { transform: 'translateX(100%)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
                        toastOut: { '0%': { transform: 'translateX(100%)', opacity: '0' } },
                        shimmer: { '0%': { backgroundPosition: '-1000px 0' }, '100%': { backgroundPosition: '1000px 0' } }
                    }
                }
            }
        }
    </script>
</head>

<body class="font-sans antialiased bg-white text-gray-900">
    <app-header></app-header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <div class="mb-8 md:mb-12 animate-fade-in">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">My Favorites</h1>
            <p class="text-gray-600">Items you've saved for later</p>

            <div class="flex space-x-4 mt-6 overflow-x-auto pb-2">
                <button data-filter="all"
                    class="filter-btn px-4 py-2 bg-black text-white rounded-full text-sm font-medium whitespace-nowrap">All
                    Items</button>
                <button data-filter="shoes"
                    class="filter-btn px-4 py-2 bg-gray-100 text-gray-800 rounded-full text-sm font-medium hover:bg-gray-200 whitespace-nowrap">Shoes</button>
                <button data-filter="apparel"
                    class="filter-btn px-4 py-2 bg-gray-100 text-gray-800 rounded-full text-sm font-medium hover:bg-gray-200 whitespace-nowrap">Apparel</button>
                <button data-filter="sale"
                    class="filter-btn px-4 py-2 bg-gray-100 text-gray-800 rounded-full text-sm font-medium hover:bg-gray-200 whitespace-nowrap">On
                    Sale</button>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-10">
            <!-- Left Column: Favorites -->
            <div class="lg:w-2/3">
                <div
                    class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 bg-gray-50 p-3 rounded-xl">
                    <div class="mb-4 sm:mb-0">
                        <span class="text-sm font-bold text-gray-900" id="favoritesCount">0 saved items</span>
                        <span class="text-gray-400 mx-2">|</span>
                        <span class="text-sm text-gray-600" id="totalValue">Total: 0₫</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <select id="sortSelect"
                                class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-2 pr-8 text-sm focus:outline-none focus:ring-1 focus:ring-black focus:border-black">
                                <option value="recent">Sort by: Recently Added</option>
                                <option value="price-asc">Sort by: Price Low to High</option>
                                <option value="price-desc">Sort by: Price High to Low</option>
                                <option value="name-asc">Sort by: Name A-Z</option>
                            </select>
                            <div
                                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20">
                                    <path
                                        d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="emptyState" class="hidden bg-gray-50 rounded-xl p-8 md:p-12 text-center animate-fade-in">
                    <div class="max-w-md mx-auto">
                        <svg class="h-16 w-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                            </path>
                        </svg>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">Your Favorites List is Empty</h3>
                        <p class="text-gray-600 mb-6">Save items you like by clicking the heart icon. They'll appear
                            here for easy access.</p>
                        <a href="../../index.html"
                            class="inline-block bg-black text-white font-medium px-6 py-3 rounded-full hover:bg-gray-800 transition-colors duration-200">
                            Start Shopping
                        </a>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="favoritesGrid">
                    <!-- Items rendered by JS -->
                </div>

                <div class="text-center mt-8">
                    <button
                        class="text-sm bg-gray-100 text-gray-900 font-medium px-6 py-2 rounded-full hover:bg-gray-200 transition-colors duration-200">
                        Load More Items
                    </button>
                </div>
            </div>

            <!-- Right Column: Featured Sale -->
            <div class="lg:w-1/3">
                <div class="sticky top-24">
                    <h2 class="text-lg font-bold text-gray-900 mb-6 flex items-center">Featured Sale <span
                            class="ml-2 px-2 py-0.5 bg-red-100 text-red-600 text-xs rounded-full">Hot</span></h2>
                    <div id="saleSidebarGrid" class="space-y-4">
                        <!-- Sale items rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="cartModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative animate-slide-up">
                <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-black">✕</button>
                <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center"><span
                        class="text-green-500 mr-2">✓</span> Added to Cart!</h3>
                <div class="flex items-center space-x-4 mb-6">
                    <img id="modalProductImage" src="" class="w-20 h-20 object-contain bg-gray-100 rounded"
                        loading="lazy" decoding="async">
                    <div>
                        <h4 id="modalProductName" class="font-medium"></h4>
                        <p id="modalProductCategory" class="text-sm text-gray-500"></p>
                        <p id="modalProductPrice" class="font-bold mt-1"></p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button onclick="window.location.href='../cart/cart.html'"
                        class="flex w-full items-center justify-center rounded-full border border-gray-300 bg-white px-4 py-3 text-base font-bold text-gray-900 hover:border-gray-400 transition-colors focus:outline-none">
                        View Cart
                    </button>

                    <button onclick="window.location.href='../cart/cart.html'"
                        class="flex w-full items-center justify-center rounded-full bg-black px-4 py-3 text-base font-bold text-white hover:bg-gray-800 transition-colors focus:outline-none">
                        Checkout
                    </button>
                </div>
                <button id="continueShoppingBtn" class="w-full mt-4 text-sm text-gray-500 underline">Continue
                    Shopping</button>
            </div>
        </div>
    </div>
    <!-- 👉 QUICK SIZE SELECTION MODAL CHO TRANG FAVORITES -->
    <div id="quickSizeModal" class="relative z-[200] hidden" role="dialog" aria-modal="true">
        <div id="quickModalBackdrop"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity opacity-0 ease-out duration-300"></div>
        <div class="fixed inset-0 z-10 w-screen overflow-y-auto flex items-center justify-center p-4">
            <div id="quickModalPanel"
                class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl transition-all sm:w-full sm:max-w-md opacity-0 scale-95 duration-300 ease-out p-6 md:p-8">

                <button onclick="closeQuickSizeModal()"
                    class="absolute top-4 right-4 text-gray-400 hover:text-gray-900 transition-colors p-2">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <div class="flex items-center gap-4 mb-6">
                    <div class="h-20 w-20 flex-shrink-0 overflow-hidden rounded-2xl bg-gray-50 p-2">
                        <img id="quickModalImg" src="" alt="" class="h-full w-full object-contain mix-blend-multiply">
                    </div>
                    <div>
                        <h4 id="quickModalName" class="font-bold text-gray-900 text-base leading-tight"></h4>
                        <p id="quickModalCategory" class="text-xs text-gray-500 mt-0.5"></p>
                        <p id="quickModalPrice" class="font-extrabold text-gray-900 text-sm mt-1"></p>
                    </div>
                </div>

                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-gray-900">Select Size <span id="quickSizeError"
                                class="text-red-500 text-xs hidden font-normal">* Please select a size</span></span>
                    </div>
                    <div id="quickSizeContainer" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
                </div>

                <div class="mb-8">
                    <span class="font-bold text-sm text-gray-900 block mb-2">Quantity</span>
                    <div class="flex items-center border border-gray-300 rounded-full w-32 px-4 py-1.5 justify-between">
                        <button type="button" onclick="adjustQuickQty(-1)"
                            class="text-gray-500 hover:text-black font-bold text-lg">−</button>
                        <span id="quickQtyDisplay" class="font-bold text-base">1</span>
                        <button type="button" onclick="adjustQuickQty(1)"
                            class="text-gray-500 hover:text-black font-bold text-lg">+</button>
                    </div>
                </div>

                <button id="confirmQuickAdd"
                    class="w-full bg-black text-white rounded-full py-4 font-bold text-base hover:bg-gray-800 transition-all shadow-lg">
                    Add to Bag
                </button>
            </div>
        </div>
    </div>
    <app-footer></app-footer>

    <!-- JavaScript -->
    <script type="module" src="favor.js"></script>
    <script src="../../assets/js/searchOverlay.js" type="module"></script>
    <script src="../../assets/js/mobile.js"></script>
</body>

</html>
